<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Regulação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa; --surface:#fff; --surface-2:#f8fafc; --border:#e3e8ef; --border-2:#d3dae4;
  --text:#0f172a; --text-2:#334155; --muted:#64748b;
  --primary:#1d4ed8; --primary-600:#1e40af; --primary-50:#eef3ff; --primary-100:#dbe6ff;
  --side:#0f1e3d; --side-2:#16284f; --side-text:#c4cee3; --side-muted:#7f8db0;
  --success:#15803d; --success-bg:#e9f8ef; --warn:#b45309; --warn-bg:#fff5e5;
  --danger:#b42318; --danger-bg:#fdeceb; --info:#0b62a8; --info-bg:#eaf4fd; --neutral:#475569; --neutral-bg:#eef1f5;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);
  --shadow-lg:0 20px 50px rgba(15,23,42,.18);
  --r:12px; --r-sm:8px;
}
:root[data-theme=dark]{
  --bg:#0a1020; --surface:#111a2e; --surface-2:#0e1628; --border:#1f2b44; --border-2:#2a3858;
  --text:#e7ecf6; --text-2:#c2cbdc; --muted:#8a97b0;
  --primary:#6e9bff; --primary-600:#8fb1ff; --primary-50:#152445; --primary-100:#1c2f5a;
  --side:#0b1428; --side-2:#13203e;
  --success:#4ade80; --success-bg:#0f2a1c; --warn:#fbbf24; --warn-bg:#2d220b; --danger:#f87171; --danger-bg:#2e1414;
  --info:#60a5fa; --info-bg:#0f2240; --neutral:#a3b0c6; --neutral-bg:#1a2438;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 20px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
.i{flex:none;display:inline-block;vertical-align:middle}
.hide{display:none!important}
.muted{color:var(--muted)} .small{font-size:12.5px} .strong{font-weight:600} .mono{font-variant-numeric:tabular-nums}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-text);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:20px 18px 16px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b6ef5,#1d3fb0);display:grid;place-items:center;flex:none}
.brand b{display:block;color:#fff;font-size:15px}
.brand span{font-size:11.5px;color:var(--side-muted)}
.unit{margin:0 14px 10px;padding:10px 12px;border-radius:10px;background:var(--side-2);font-size:12px}
.unit small{display:block;color:var(--side-muted);font-size:11px}
.unit b{color:#fff;font-weight:600}
.nav{padding:4px 10px 10px;flex:1}
.nav-g{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-muted);padding:14px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-text);text-decoration:none;cursor:pointer;font-weight:500;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:#2450c9;color:#fff}
.nav a .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600}
.nav a .cnt.alert{background:#e5484d}
.side-f{padding:14px 18px;font-size:11.5px;color:var(--side-muted);border-top:1px solid rgba(255,255,255,.07)}
.side-f button{background:none;border:0;color:var(--side-text);text-decoration:underline;cursor:pointer;padding:0;font-size:11.5px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;height:64px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px}
.top .crumb{font-size:12px;color:var(--muted)}
.top h2{font-size:16px}
.gsearch{position:relative;margin-left:auto;width:min(380px,40vw)}
.gsearch input{width:100%;height:38px;border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:0 60px 0 36px}
.gsearch input:focus{outline:2px solid var(--primary-100);border-color:var(--primary)}
.gsearch .i{position:absolute;left:11px;top:10px;color:var(--muted)}
.gsearch kbd{position:absolute;right:9px;top:9px;font:11px Inter,sans-serif;border:1px solid var(--border-2);border-radius:5px;padding:1px 5px;color:var(--muted);background:var(--surface)}
.dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:40;max-height:420px;overflow:auto}
.dropdown .dd-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px 4px;font-weight:600}
.dd-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.dd-item:hover,.dd-item.act{background:var(--primary-50)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--text-2);position:relative;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:disabled{opacity:.4;cursor:default}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:99px;background:#e5484d;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.user{display:flex;align-items:center;gap:10px;padding-left:6px}
.user b{display:block;font-size:13px}.user span{font-size:11.5px;color:var(--muted)}
.menu-btn{display:none}
.bell-wrap{position:relative}
.bell-wrap .dropdown{left:auto;right:0;width:340px}

.view{padding:24px;max-width:1360px;width:100%;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h h1{font-size:22px}
.page-h p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Componentes ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:15px}
.card-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:3fr 2fr}.g3{grid-template-columns:repeat(3,1fr)}.g-eq{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .lbl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .lbl .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary)}
.kpi .val{font-size:28px;font-weight:700;margin-top:10px;letter-spacing:-.02em}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
:root[data-theme=dark] .btn.primary{color:#0a1020}
.btn.primary:hover{background:var(--primary-600);border-color:var(--primary-600)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.lg{height:44px;padding:0 20px;font-size:14.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ok{background:var(--success);border-color:var(--success);color:#fff}
.btn.ok:hover{filter:brightness(.95);background:var(--success)}
:root[data-theme=dark] .btn.ok{color:#0a1020}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.field>label em{color:var(--danger);font-style:normal}
.input,.select,.textarea{width:100%;height:40px;border:1px solid var(--border-2);border-radius:9px;background:var(--surface);padding:0 12px;transition:border-color .12s,box-shadow .12s}
.textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-100)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.form-sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;grid-column:1/-1;padding-top:12px;border-top:1px solid var(--border);margin-top:4px}
.form-sec:first-child{border:0;padding:0;margin:0}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;height:40px}
.switch input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--border-2);position:relative;cursor:pointer;transition:.15s;margin:0}
.switch input::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{left:19px}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search .i{position:absolute;left:12px;top:11px;color:var(--muted)}
.search .input{padding-left:38px}

.seg{display:inline-flex;background:var(--neutral-bg);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg .n{font-size:11px;background:var(--border);border-radius:99px;padding:0 6px;color:var(--text-2)}
.seg button.on .n{background:var(--primary-50);color:var(--primary)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.info{background:var(--info-bg);color:var(--info)}.badge.success{background:var(--success-bg);color:var(--success)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.danger{background:var(--danger-bg);color:var(--danger)}
.badge.neutral{background:var(--neutral-bg);color:var(--neutral)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--neutral-bg);color:var(--text-2);white-space:nowrap}
.tag.prio{background:var(--danger-bg);color:var(--danger)}
.tag.blue{background:var(--primary-50);color:var(--primary)}

.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.t td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--surface-2)}
.t tr.click{cursor:pointer}
.t .r{text-align:right}
.t td.act{text-align:right;white-space:nowrap}
.t td.act .btn+.btn{margin-left:6px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who span{display:block;font-size:12px;color:var(--muted)}
.t .who b,.t .who span{white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.avatar.lg{width:52px;height:52px;font-size:17px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .i{color:var(--border-2);margin-bottom:8px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--border)}
.toolbar .sp{flex:1}

.list-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;transition:.12s}
.list-row:hover{border-color:var(--primary);background:var(--primary-50)}
.list-row.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-100)}
.list-row .grow{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.feed li:last-child{border:0}
.feed .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:6px;flex:none}
.bar{height:8px;background:var(--neutral-bg);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.hbar{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;padding:7px 0;font-size:13px}
.hbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--primary-50);color:var(--primary);font-weight:500;margin-bottom:16px;border:1px solid var(--primary-100)}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.dl{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:12px;color:var(--muted);font-weight:500}
.dl dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.dl .full{grid-column:1/-1}

/* Assistente de agendamento */
.stepper{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:10px;flex:1;min-width:150px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-weight:600;font-size:13px}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--neutral-bg);font-size:12.5px;flex:none}
.step.on{border-color:var(--primary);color:var(--text)}
.step.on .n{background:var(--primary);color:#fff}
.step.done{cursor:pointer;color:var(--text-2)}
.step.done .n{background:var(--success-bg);color:var(--success)}
.wiz{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.summary{position:sticky;top:84px}
.summary .dl{grid-template-columns:1fr}
.esp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.esp{border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;background:var(--surface);text-align:left;transition:.12s}
.esp:hover{border-color:var(--primary)}
.esp.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-100);background:var(--primary-50)}
.esp b{display:block;font-size:14px;margin-bottom:2px}
.esp span{font-size:12.5px;color:var(--muted)}
.esp .free{color:var(--success);font-weight:600}
.esp .none{color:var(--danger);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1/0.82;border:1px solid var(--border);border-radius:9px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;padding:0}
.cal .d small{font-size:10.5px;font-weight:600;color:var(--success)}
.cal .d:hover:not(:disabled){border-color:var(--primary)}
.cal .d:disabled{background:var(--surface-2);color:var(--border-2);cursor:default;border-color:transparent}
.cal .d.today{outline:2px dashed var(--primary-100)}
.cal .d.on{background:var(--primary);border-color:var(--primary);color:#fff}
.cal .d.few small{color:var(--warn)}
.cal .d.on small{color:#fff}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h b{font-size:15px}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.slot{border:1px solid var(--border-2);border-radius:8px;background:var(--surface);padding:6px 10px;font-weight:600;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.slot:hover{border-color:var(--primary);color:var(--primary)}
.slot.on{background:var(--primary);border-color:var(--primary);color:#fff}
.prof-slots{padding:14px 0;border-bottom:1px solid var(--border)}
.prof-slots:last-child{border:0}
.success-box{text-align:center;padding:32px 20px}
.success-box .okc{width:64px;height:64px;border-radius:50%;background:var(--success-bg);color:var(--success);display:grid;place-items:center;margin:0 auto 14px}

/* Agenda do dia */
.day-nav{display:flex;align-items:center;gap:6px}
.sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.srow{display:flex;align-items:center;gap:12px;padding:8px 18px;border-bottom:1px solid var(--border);min-height:48px}
.srow:last-child{border:0}
.srow .h{width:46px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-2)}
.srow .grow{flex:1;min-width:0}
.srow.free .grow{color:var(--muted)}
.srow.booked{cursor:pointer}
.srow.booked:hover{background:var(--surface-2)}
.srow.past.free{opacity:.5}
.prof-card{display:flex;flex-direction:column}
.prof-top{display:flex;gap:12px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.card-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border);margin-top:auto}

/* Sobreposições */
.overlay{position:fixed;inset:0;background:rgba(10,16,32,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:14px;width:min(520px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .16s}
.modal.wide{width:min(720px,100%)}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:16px}
.modal-h .icon-btn{width:32px;height:32px;border:0}
.modal-b{padding:20px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 14px 14px;flex-wrap:wrap}
.overlay.drawer-ov{justify-content:flex-end;padding:0}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slide .2s}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer .modal-b{flex:1}
.drawer .modal-f{border-radius:0}
.drawer .modal-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:22px 0 10px}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--success);border-radius:10px;padding:12px 16px;box-shadow:var(--shadow-lg);min-width:280px;max-width:400px;animation:pop .2s;font-weight:500}
.toast.error{border-left-color:var(--danger)}.toast.info{border-left-color:var(--primary)}
.toast .i{color:var(--success)}.toast.error .i{color:var(--danger)}.toast.info .i{color:var(--primary)}

/* Seletor de paciente */
.picker-in{position:relative}
.picker-in>.i{position:absolute;left:12px;top:11px;color:var(--muted)}
.picker-in .input{padding-left:38px}
.picker-sel .list-row{cursor:default}
.picker-sel .list-row:hover{background:var(--surface);border-color:var(--border)}

.faq details{border-bottom:1px solid var(--border);padding:14px 0}
.faq details:last-child{border:0}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--muted);font-size:18px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{margin:8px 0 0;color:var(--text-2)}

.receipt{border:1px solid var(--border);border-radius:12px;padding:20px}
.receipt .rh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:14px}
.receipt ul{margin:8px 0 0;padding-left:18px;color:var(--text-2);font-size:13px}

@media (max-width:1100px){
  .g2,.g3,.wiz,.g-eq{grid-template-columns:1fr}
  .summary{position:static}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:90;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .side{transform:none;box-shadow:var(--shadow-lg)}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(10,16,32,.4);z-index:80}
  .menu-btn{display:grid}
  .top{padding:0 16px;gap:8px}
  .top .titles{display:none}
  .gsearch{width:auto;flex:1;margin-left:0}
  .gsearch kbd,.user div{display:none}
  .view{padding:16px}
  .form-grid,.dl{grid-template-columns:1fr}
  .sched{grid-template-columns:1fr}
  .hbar{grid-template-columns:100px 1fr 40px}
  .bell-wrap .dropdown{position:fixed;left:16px;right:16px;top:70px;width:auto}
}
@media print{
  .side,.top,.no-print,#toasts{display:none!important}
  .app{display:block}
  body{background:#fff}
  .card{box-shadow:none}
  body.print-modal .app{display:none}
  body.print-modal .overlay{position:static;background:none;padding:0}
  body.print-modal .modal{box-shadow:none;max-height:none;width:100%}
  body.print-modal .modal-h,body.print-modal .modal-f{display:none}
}

/* =========================================================

   ========================================================= */
const KEY='regamb_v2';
let S, IDX=null;
function load(){ try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){} if(!S||!S.seq) S=seed(); }
function save(){ IDX=null; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function log(msg){ S.log.unshift({ts:Date.now(), msg}); S.log=S.log.slice(0,60); }

const pac  = id => S.patients.find(p=>p.id==id);
const prof = id => S.profs.find(p=>p.id==id);
const appt = id => S.appts.find(a=>a.id==id);
const ESPS = () => [...new Set(S.profs.map(p=>p.esp))].sort();

function slotsOf(p){
  const out=[], [h0,h1] = p.turno==='M' ? [7,12] : [13,17];
  for(let h=h0; h<h1; h++) for(let m=0; m<60; m+=20) out.push(pad(h)+':'+pad(m));
  return out;
}
function works(p, day){ return p.dias.includes(D(day).getDay()) && !p.bloqueios.some(b=>b.data===day); }
function bookedIdx(){
  if(IDX) return IDX;
  IDX=new Map();
  S.appts.forEach(a=>{ if(a.st==='cancelado'||a.extra) return; const k=a.prof+'|'+a.data; if(!IDX.has(k)) IDX.set(k,new Set()); IDX.get(k).add(a.hora); });
  return IDX;
}
function freeSlots(p, day){
  const t=today();
  if(day<t || !works(p,day)) return [];
  const b=bookedIdx().get(p.id+'|'+day)||new Set(), nh=nowHM();
  return slotsOf(p).filter(h=>!b.has(h) && (day>t || h>nh));
}
function firstFree(esp, profId, from=today(), max=150){
  for(let i=0;i<max;i++){ const d=addDays(from,i); if(S.profs.some(p=>p.esp===esp && (!profId||p.id==profId) && freeSlots(p,d).length)) return d; }
  return null;
}
function absRate(de, ate){
  const l=S.appts.filter(a=>a.data>=de && a.data<=ate && (a.st==='atendido'||a.st==='ausente'));
  return l.length ? Math.round(l.filter(a=>a.st==='ausente').length*100/l.length) : 0;
}
function searchPatients(q, n=8){
  q=norm(q).trim(); if(!q) return [];
  const dq=q.replace(/\D/g,'');
  return S.patients.filter(p=> norm(p.nome).includes(q) || norm(p.social).includes(q) ||
    (dq.length>=3 && (p.cpf.includes(dq)||(p.cns||'').includes(dq)||String(p.id).includes(dq)||(p.pront||'').includes(dq)))).slice(0,n);
}

function toast(msg, kind='success'){
  const el=document.createElement('div'); el.className='toast '+kind; el.setAttribute('role','status');
  el.innerHTML = ic(kind==='error'?'alert':kind==='info'?'help':'check',18)+`<div>${msg}</div>`;
  const box=$('#toasts'); box.appendChild(el); while(box.children.length>3) box.firstElementChild.remove();
  setTimeout(()=>el.remove(), 3800);
}
function overlay(cls, inner){
  const ov=document.createElement('div'); ov.className='overlay '+cls; ov.innerHTML=inner;
  ov.addEventListener('mousedown', e=>{ if(e.target===ov) ov.remove(); });
  ov.addEventListener('click', e=>{ if(e.target.closest('[data-close]')) ov.remove(); });
  document.body.appendChild(ov);
  return ov;
}
function openModal({title, body, actions=[], wide}){
  const ov=overlay('', `<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="modal-h"><h3>${title}</h3><button class="icon-btn" data-close aria-label="Fechar">${ic('x')}</button></div>
    <form class="modal-b" novalidate>${body}</form><div class="modal-f"></div></div>`);
  const foot=$('.modal-f',ov), form=$('form',ov);
  actions.forEach(a=>{
    const b=document.createElement('button'); b.className='btn '+(a.cls||''); b.innerHTML=a.label; b.type='button';
    b.onclick=()=>{ if(a.fn && a.fn(Object.fromEntries(new FormData(form)), ov)===false) return; ov.remove(); };
    foot.appendChild(b);
  });
  form.addEventListener('submit', e=>{ e.preventDefault(); foot.lastElementChild?.click(); });
  setTimeout(()=>$('input:not([type=hidden]),select,textarea',ov)?.focus(), 30);
  return ov;
}
function confirmBox(title, msg, okLabel, fn, danger){
  openModal({title, body:`<p style="margin:0;color:var(--text-2)">${msg}</p>`, actions:[{label:'Voltar',cls:'ghost'},{label:okLabel,cls:danger?'danger':'primary',fn}]});
}
function openDrawer({title, sub='', body, submit, onSubmit, footer}){
  const ov=overlay('drawer-ov', `<div class="drawer" role="dialog" aria-modal="true"><div class="modal-h"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div><button class="icon-btn" data-close aria-label="Fechar">${ic('x')}</button></div>
    <form class="modal-b" novalidate>${body}</form>
    <div class="modal-f">${footer ?? `<button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn primary" type="button" data-submit>${submit||'Salvar'}</button>`}</div></div>`);
  const form=$('form',ov);
  const go=()=>{ const d=Object.fromEntries(new FormData(form)); if(onSubmit && onSubmit(d, form)===false) return; ov.remove(); };
  form.addEventListener('submit', e=>{ e.preventDefault(); go(); });
  $('[data-submit]',ov)?.addEventListener('click', go);
  if(onSubmit) setTimeout(()=>$('input:not([type=hidden]),select,textarea',form)?.focus(), 40);
  return ov;
}

function patientForm(p, cb){
  const isNew=!p; p=p||{};
  openModal({ title: isNew?'Cadastrar paciente':'Editar paciente', wide:true, body:`
    <div class="form-grid">
      ${field(req('Nome completo'), `<input class="input" name="nome" value="${esc(p.nome)}">`,'full')}
      ${field('Nome social', `<input class="input" name="social" value="${esc(p.social)}">`)}
      ${field(req('Data de nascimento'), `<input class="input" type="date" name="nasc" value="${esc(p.nasc)}" max="${today()}">`)}
      ${field('CPF', `<input class="input" name="cpf" inputmode="numeric" maxlength="14" value="${esc(p.cpf?cpfFmt(p.cpf):'')}" placeholder="000.000.000-00">`)}
      ${field('Cartão SUS (CNS)', `<input class="input" name="cns" inputmode="numeric" maxlength="15" value="${esc(p.cns)}">`)}
      ${field(req('Nome da mãe (Filiação 1)'), `<input class="input" name="mae" value="${esc(p.mae)}">`,'full')}
      ${field('RG', `<input class="input" name="rg" value="${esc(p.rg)}">`)}
      ${field('Prontuário', `<input class="input" name="pront" value="${esc(p.pront)}">`)}
      ${field('Telefone', `<input class="input" name="fone" value="${esc(p.fone)}" placeholder="(00) 00000-0000">`)}
      ${field('Município', `<input class="input" name="cidade" value="${esc(p.cidade||'Vale Verde')}">`)}
    </div>`,
    actions:[{label:'Cancelar',cls:'ghost'},{label:isNew?'Cadastrar':'Salvar alterações',cls:'primary',fn:d=>{
      ['nome','social','mae'].forEach(k=>d[k]=d[k].trim().toUpperCase());
      d.cpf=d.cpf.replace(/\D/g,''); d.cns=d.cns.replace(/\D/g,'');
      if(!d.nome||!d.nasc||!d.mae){ toast('Preencha nome, data de nascimento e nome da mãe.','error'); return false; }
      if(d.cpf && d.cpf.length!==11){ toast('O CPF deve ter 11 dígitos.','error'); return false; }
      if(d.cpf && S.patients.some(x=>x.cpf===d.cpf && x.id!==p.id)){ toast('Já existe um paciente com este CPF.','error'); return false; }
      if(isNew){ d.id=S.seq.pac++; S.patients.push(d); log('Paciente cadastrado: '+title(d.nome)); } else Object.assign(p,d);
      save(); toast(isNew?`Paciente cadastrado (código ${d.id}).`:'Cadastro atualizado.'); render(); cb && cb(isNew?d:p);
    }}]
  });
}

function resetBook(o={}){ UI.book={step:1,q:'',pac:null,esp:'',tipo:'Primeira vez',prof:'',month:null,day:null,sel:null,obs:'',demanda:null,jud:null,preset:null,done:null,...o}; }
function pAgendar(){
  const B=UI.book;
  if(B.done) return pBookDone();
  const steps=['Paciente','Atendimento','Data e horário','Confirmação'];
  const stepper=`<div class="stepper">${steps.map((s,i)=>{const n=i+1, cls=n===B.step?'on':n<B.step?'done':''; return `<div class="step ${cls}" ${n<B.step?`data-act="bookStep" data-n="${n}"`:''}><span class="n">${n<B.step?ic('check',14):n}</span>${s}</div>`}).join('')}</div>`;
  let banner='';
  if(B.demanda){ const d=S.demandas.find(x=>x.id===B.demanda); banner=`<div class="banner">${ic('inbox')}Agendando a demanda nº ${d.id} — ${esc(d.obs||d.esp)}</div>`; }
  if(B.jud){ const j=S.jud.find(x=>x.id===B.jud); banner=`<div class="banner warn">${ic('scale')}Cumprimento de ação judicial — processo ${j.processo} · prazo ${br(j.prazo)}</div>`; }
  if(B.preset){ const pr=prof(B.preset.prof); banner=`<div class="banner">${ic('clock')}Horário reservado: ${longDate(B.preset.day)} às ${B.preset.hora} com ${title(pr.nome)} (${pr.esp})</div>`; }
  const body = [null,bStep1,bStep2,bStep3,bStep4][B.step]();
  return pageH('Novo agendamento','Siga as etapas para marcar uma consulta na agenda da unidade.', (B.pac||B.esp)?`<button class="btn ghost" data-act="bookReset">${ic('undo',16)}Recomeçar</button>`:'')

function bStep1(){
  const B=UI.book, q=B.q.trim();
  let list = q ? searchPatients(q, 10) : [];
  if(!q){ const seen=new Set(); S.appts.slice().sort((a,b)=>b.data.localeCompare(a.data)).forEach(a=>{ if(seen.size<6 && a.data<=today()) seen.add(a.pac); }); list=[...seen].map(pac); }
  return `<div class="card"><div class="card-h"><div><h3>Quem será atendido?</h3><p>Busque pelo nome, CPF, CNS, código ou prontuário.</p></div><button class="btn" data-act="newPatBook">${ic('plus',16)}Novo paciente</button></div>
    <div class="card-b"><div class="search" style="max-width:none">${ic('search',16)}<input class="input" id="bq" data-model="book.q" value="${esc(B.q)}" placeholder="Ex.: Maria Aparecida ou 123.456.789-00" autocomplete="off"></div>
    <div class="small muted" style="margin:14px 0 8px;font-weight:600">${q?`${list.length} resultado(s)`:'Atendidos recentemente'}</div>
    <div class="list">${list.length?list.map(p=>`<button class="list-row ${B.pac===p.id?'on':''}" data-act="bookPac" data-id="${p.id}">${patRow(p, ic('right',18))}</button>`).join(''):emptyBox('search','Nenhum paciente encontrado. Confira os dados ou cadastre um novo paciente.')}</div></div></div>`;
}
function bStep2(){
  const B=UI.book, t=today();
  const cards = ESPS().map(e=>{
    const ps=S.profs.filter(p=>p.esp===e); let free=0;
    for(let i=0;i<30;i++){ const d=addDays(t,i); ps.forEach(p=>free+=freeSlots(p,d).length); }
    const ff=firstFree(e,null);
    return `<button class="esp ${B.esp===e?'on':''}" data-act="bookEsp" data-v="${esc(e)}"><b>${e}</b><span>${ps.length} profissional(is)</span><br>
      <span class="${free?'free':'none'}">${free?`${free} vagas em 30 dias`:'Sem vagas em 30 dias'}</span>${ff?`<span> · próxima ${brs(ff)}</span>`:''}</button>`;
  }).join('');
  return `<div class="card"><div class="card-h"><div><h3>Atendimento</h3><p>Escolha o tipo de consulta e a especialidade.</p></div></div><div class="card-b">
    <div class="field" style="margin-bottom:18px"><label>Tipo de consulta</label><div class="seg">${TIPOS.map(t=>`<button data-act="bookTipo" data-v="${t}" class="${B.tipo===t?'on':''}">${t}</button>`).join('')}</div></div>

    ${B.esp?`<div class="field" style="margin-top:18px;max-width:420px"><label>Profissional (opcional)</label><select class="select" id="bprof" data-model="book.prof">${opts(S.profs.filter(p=>p.esp===B.esp).map(p=>[p.id,title(p.nome)+(p.turno==='M'?' · manhã':' · tarde')]),B.prof,'Qualquer profissional')}</select></div>`:''}

function bStep3(){
  const B=UI.book, t=today();
  if(!B.month){ const ff=firstFree(B.esp,B.prof)||t; B.month=ff.slice(0,7); }
  const [y,m]=B.month.split('-').map(Number), first=new Date(y,m-1,1).getDay(), nd=new Date(y,m,0).getDate();
  const profs=S.profs.filter(p=>p.esp===B.esp && (!B.prof||p.id==B.prof));
  let cells=WD.map(w=>`<div class="wd">${w}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1; d<=nd; d++){
    const day=`${y}-${pad(m)}-${pad(d)}`, free=profs.reduce((s,p)=>s+freeSlots(p,day).length,0);
    cells+=`<button class="d ${day===t?'today':''} ${B.day===day?'on':''} ${free&&free<4?'few':''}" ${free?`data-act="bookDay" data-v="${day}"`:'disabled'} aria-label="${d} de ${MESES[m-1]}: ${free} vagas">${d}${free?`<small>${free} vaga${free>1?'s':''}</small>`:''}</button>`;
  }
  const curM=t.slice(0,7), maxM=addDays(t,150).slice(0,7);
  const right = B.day ? profs.filter(p=>freeSlots(p,B.day).length).map(p=>`<div class="prof-slots"><div class="who"><div class="avatar">${initials(p.nome)}</div><div><b>${title(p.nome)}</b><span>${p.crm} · ${p.turno==='M'?'Manhã':'Tarde'}</span></div></div>
      <div class="slots">${freeSlots(p,B.day).map(h=>`<button class="slot ${B.sel&&B.sel.prof===p.id&&B.sel.hora===h?'on':''}" data-act="bookSlot" data-p="${p.id}" data-h="${h}">${h}</button>`).join('')}</div></div>`).join('')
    : emptyBox('calendar','Selecione um dia com vagas no calendário.');
  return `<div class="card"><div class="card-h"><div><h3>Data e horário</h3><p>${B.esp}${B.prof?' · '+title(prof(B.prof).nome):''}</p></div><button class="btn sm" data-act="bookFirst">${ic('zap',15)}Primeira data disponível</button></div>
    <div class="card-b"><div class="grid g-eq">
      <div><div class="cal-h"><button class="icon-btn" data-act="bookMonth" data-v="-1" ${B.month<=curM?'disabled':''} aria-label="Mês anterior">${ic('left')}</button><b>${capital(MESES[m-1])} de ${y}</b><button class="icon-btn" data-act="bookMonth" data-v="1" ${B.month>=maxM?'disabled':''} aria-label="Próximo mês">${ic('right')}</button></div>
        <div class="cal">${cells}</div></div>
      <div>${B.day?`<div class="strong" style="margin-bottom:4px">${capital(longDate(B.day))}</div>`:''}${right}</div>

  </div></div>`;
}

function statusActions(a){

  if(a.st==='presente') return `<button class="btn sm primary" data-act="finish" data-id="${a.id}">${ic('check',15)}Finalizar</button><button class="btn sm ghost" data-act="undo" data-id="${a.id}" title="Desfazer chegada" aria-label="Desfazer chegada">${ic('undo',15)}</button>`;
  if(a.st==='ausente'||a.st==='atendido') return `<button class="btn sm ghost" data-act="undo" data-id="${a.id}" title="Desfazer" aria-label="Desfazer">${ic('undo',15)}</button>`;
  return '';
}
function pRecepcao(){
  const t=today(), R=UI.rec, all=S.appts.filter(a=>a.data===t&&a.st!=='cancelado').sort(byTime);
  const F={todos:['Todos',()=>true],agendado:['A chegar',a=>a.st==='agendado'],presente:['Aguardando',a=>a.st==='presente'],atendido:['Atendidos',a=>a.st==='atendido'],ausente:['Faltas',a=>a.st==='ausente']};
  const q=norm(R.q);
  const list=all.filter(F[R.f][1]).filter(a=>{ if(!q) return true; const p=pac(a.pac), pr=prof(a.prof); return norm(p.nome+' '+p.id+' '+p.cpf+' '+pr.nome+' '+pr.esp).includes(q); });
  const wait = a => { if(a.st!=='presente'||!a.chegada) return ''; const [h,m]=a.chegada.split(':').map(Number), n=new Date(), w=n.getHours()*60+n.getMinutes()-(h*60+m); return w>0?`<div class="small" style="color:${w>45?'var(--danger)':'var(--warn)'}">aguardando ${w} min</div>`:''; };
  return pageH('Recepção', `${capital(longDate(t))} · registre chegadas e faltas e finalize atendimentos.`,
      `<button class="btn" data-nav="encaixe">${ic('zap',16)}Encaixe</button><button class="btn primary" data-nav="agendar">${ic('plus',16)}Agendar</button>`)
   + `<div class="card"><div class="toolbar">
       <div class="seg">${Object.entries(F).map(([k,[l,f]])=>`<button data-act="setRec" data-v="${k}" class="${R.f===k?'on':''}">${l}<span class="n">${all.filter(f).length}</span></button>`).join('')}</div>
       <span class="sp"></span><div class="search">${ic('search',16)}<input class="input" id="rq" data-model="rec.q" value="${esc(R.q)}" placeholder="Filtrar paciente ou profissional"></div></div>
     <div class="table-wrap">${list.length?`<table class="t"><thead><tr><th>Horário</th><th>Paciente</th><th>Especialidade / profissional</th><th>Tipo</th><th>Chegada</th><th>Situação</th><th></th></tr></thead><tbody>
       ${list.map(a=>{const p=pac(a.pac), pr=prof(a.prof); return `<tr>
         <td class="mono strong">${a.hora}${a.extra?' <span class="tag">Encaixe</span>':''}</td>
         <td><div class="who" data-act="openPatient" data-id="${p.id}" style="cursor:pointer"><div class="avatar">${initials(p.nome)}</div><div><b>${esc(title(p.nome))}</b><span>${age(p.nasc)} anos · Cód. ${p.id}</span></div></div></td>
         <td><div class="who"><div><b style="font-weight:500">${pr.esp}</b><span>${title(pr.nome)}</span></div></div></td>
         <td>${a.tipo}</td><td class="mono">${a.chegada||'—'}${wait(a)}</td><td>${badge(a.st)}</td>
         <td class="act">${statusActions(a)}<button class="btn sm ghost" data-act="openAppt" data-id="${a.id}" title="Detalhes" aria-label="Detalhes">${ic('more',16)}</button></td></tr>`}).join('')}
     </tbody></table>`:emptyBox('clipboard','Nenhum atendimento neste filtro.')}</div></div>`;
}

/* ---------- Agenda do dia ---------- */
function pAgenda(){
  const A=UI.day, t=today(), nh=nowHM();
  const profs=S.profs.filter(p=>(!A.prof||p.id==A.prof)&&works(p,A.date));
  const blocked=S.profs.filter(p=>(!A.prof||p.id==A.prof)&&p.bloqueios.some(b=>b.data===A.date));
  const cards=profs.map(p=>{
    const ap=S.appts.filter(a=>a.prof===p.id&&a.data===A.date&&a.st!=='cancelado');
    const rows=slotsOf(p).map(h=>({h, a:ap.find(a=>a.hora===h&&!a.extra)})).concat(ap.filter(a=>a.extra).map(a=>({h:a.hora,a}))).sort((x,y)=>x.h.localeCompare(y.h));
    const tot=slotsOf(p).length, busy=rows.filter(r=>r.a&&!r.a.extra).length;
    return `<div class="card"><div class="card-h"><div class="who"><div class="avatar">${initials(p.nome)}</div><div><b>${title(p.nome)}</b><span>${p.esp} · ${p.turno==='M'?'Manhã':'Tarde'}</span></div></div>
      <div style="text-align:right;min-width:90px"><div class="small strong mono">${busy}/${tot}</div><div class="bar" style="margin-top:4px"><i style="width:${busy*100/tot}%;background:var(--primary)"></i></div></div></div>
      <div>${rows.map(({h,a})=>{ const past=A.date<t||(A.date===t&&h<nh);
        if(!a) return `<div class="srow free ${past?'past':''}"><span class="h">${h}</span><span class="grow">Horário livre</span>${!past?`<button class="btn sm" data-act="slotBook" data-p="${p.id}" data-h="${h}">${ic('plus',14)}Agendar</button>`:''}</div>`;
        const pa=pac(a.pac); return `<div class="srow booked" data-act="openAppt" data-id="${a.id}"><span class="h">${h}</span><span class="grow who"><span style="min-width:0"><b>${esc(title(pa.nome))}</b><span>${a.tipo}${a.extra?' · Encaixe':''}</span></span></span>${badge(a.st)}</div>`;}).join('')}</div></div>`;
  }).join('');
  return pageH('Agenda do dia', capital(longDate(A.date)),
     `<div class="day-nav"><button class="icon-btn" data-act="dayNav" data-v="-1" aria-label="Dia anterior">${ic('left')}</button><input type="date" class="input" style="width:160px" id="dd" data-model="day.date" value="${A.date}"><button class="icon-btn" data-act="dayNav" data-v="1" aria-label="Próximo dia">${ic('right')}</button><button class="btn" data-act="dayNav" data-v="0">Hoje</button></div>
      <select class="select" style="width:260px" id="dp" data-model="day.prof">${profOpts(A.prof)}</select>
      <button class="btn" data-act="print">${ic('printer',16)}Imprimir</button>`)
   + (blocked.length?`<div class="banner warn">${ic('lock')}Agenda bloqueada: ${blocked.map(p=>title(p.nome)+' ('+esc(p.bloqueios.find(b=>b.data===A.date).motivo)+')').join(', ')}</div>`:'')
   + (profs.length?`<div class="sched">${cards}</div>`:`<div class="card">${emptyBox('calendar','Nenhum profissional atende nesta data.')}</div>`);
}

/* ---------- Relatórios ---------- */
function pRelatorios(){
  const R=UI.rel, list=S.appts.filter(a=>a.data>=R.de&&a.data<=R.ate);
  const c = s => list.filter(a=>a.st===s).length;
  const real=c('atendido')+c('ausente');
  const COLS=[['atendido','var(--success)'],['ausente','var(--danger)'],['agendado','var(--primary)'],['presente','var(--warn)'],['cancelado','var(--border-2)']];
  const byE=ESPS().map(e=>{ const l=list.filter(a=>prof(a.prof).esp===e); return [e, l.length, Object.fromEntries(COLS.map(([s])=>[s,l.filter(a=>a.st===s).length]))]; });
  const max=Math.max(1,...byE.map(x=>x[1]));
  const byP=S.profs.map(p=>{ const l=list.filter(a=>a.prof===p.id), at=l.filter(a=>a.st==='atendido').length, au=l.filter(a=>a.st==='ausente').length; return {p, tot:l.length, at, au, abs:at+au?Math.round(au*100/(at+au)):0}; }).sort((a,b)=>b.tot-a.tot);
  return pageH('Relatórios', `Período de ${br(R.de)} a ${br(R.ate)}`,
      `<div class="seg no-print">${[[7,'7 dias'],[30,'30 dias'],[90,'90 dias']].map(([d,l])=>`<button data-act="relPreset" data-v="${d}" class="${R.preset===d?'on':''}">${l}</button>`).join('')}</div>
       <input type="date" class="input no-print" style="width:150px" id="rd" data-model="rel.de" value="${R.de}" aria-label="Data inicial"><input type="date" class="input no-print" style="width:150px" id="ra" data-model="rel.ate" value="${R.ate}" aria-label="Data final">
       <button class="btn no-print" data-act="csv">${ic('download',16)}Exportar CSV</button><button class="btn no-print" data-act="print">${ic('printer',16)}Imprimir</button>`)
   + `<div class="kpis">
      ${kpi('Agendamentos', list.length, `${list.filter(a=>a.extra).length} encaixe(s)`)}
      ${kpi('Comparecimento', (real?Math.round(c('atendido')*100/real):0)+'%', `${c('atendido')} atendidos`, '', 'var(--success)')}
      ${kpi('Absenteísmo', (real?Math.round(c('ausente')*100/real):0)+'%', `${c('ausente')} faltas`, '', 'var(--danger)')}
      ${kpi('Cancelamentos', c('cancelado'), `${list.length?Math.round(c('cancelado')*100/list.length):0}% do total`)}
    </div>
    <div class="grid g-eq">
      <div class="card"><div class="card-h"><div><h3>Agendamentos por especialidade</h3><p>Distribuição por situação</p></div></div><div class="card-b">
        <div class="legend" style="margin-bottom:12px">${COLS.map(([s,col])=>`<span style="--c:${col}">${ST[s][0]}</span>`).join('')}</div>
        ${byE.map(([e,tot,st])=>`<div class="hbar"><span class="small" title="${e}">${e}</span><div><div class="bar" style="height:14px;width:${tot*100/max}%;min-width:2px">${COLS.map(([s,col])=>st[s]?`<i title="${ST[s][0]}: ${st[s]}" style="width:${st[s]*100/tot}%;background:${col}"></i>`:'').join('')}</div></div><span class="small mono r strong">${tot}</span></div>`).join('')}
      </div></div>
      <div class="card"><div class="card-h"><div><h3>Por profissional</h3></div></div><div class="table-wrap"><table class="t"><thead><tr><th>Profissional</th><th class="r">Total</th><th class="r">Atendidos</th><th class="r">Faltas</th><th class="r">Absent.</th></tr></thead><tbody>
        ${byP.map(x=>`<tr><td><b style="font-weight:500">${title(x.p.nome)}</b><div class="small muted">${x.p.esp}</div></td><td class="r mono">${x.tot}</td><td class="r mono">${x.at}</td><td class="r mono">${x.au}</td><td class="r mono" style="color:${x.abs>15?'var(--danger)':'inherit'}">${x.abs}%</td></tr>`).join('')}
      </tbody></table></div></div>
    </div>`;
}

const FORMS = {
  encaixe: d=>{
    if(!d.pac||!d.prof||!d.data||!d.hora||!d.motivo) return toast('Preencha todos os campos obrigatórios.','error');
    const p=prof(+d.prof);
    if(!works(p,d.data)) return toast('O profissional não tem agenda nesta data.','error');
    if(d.data===today() && d.hora<nowHM()) return toast('O horário informado já passou.','error');
    const a={id:S.seq.appt++, pac:+d.pac, prof:p.id, data:d.data, hora:d.hora, tipo:d.tipo, st:'agendado', chegada:'', obs:d.obs.trim(), motivo:d.motivo, extra:true, hist:[{ts:Date.now(),msg:'Encaixe registrado: '+d.motivo}]};
    S.appts.push(a); log(`Encaixe: ${title(pac(a.pac).nome)} — ${p.esp}, ${brs(a.data)} ${a.hora}`); save();
    toast('Encaixe registrado.'); render();
  },
  troca: d=>{
    if(!d.appt) return toast('Selecione o horário a ser trocado.','error');
    if(!d.novo||!d.motivo) return toast('Informe o novo paciente e o motivo.','error');
    const a=appt(+d.appt);
    if(a.pac===+d.novo) return toast('O novo paciente é o mesmo do agendamento.','error');
    const de=a.pac; a.pac=+d.novo; (a.hist=a.hist||[]).push({ts:Date.now(), msg:`Troca de paciente: ${title(pac(de).nome)} → ${title(pac(a.pac).nome)} (${d.motivo})`});
    S.trocas.unshift({data:a.data, hora:a.hora, de, para:a.pac, motivo:d.motivo, appt:a.id});
    log(`Troca de paciente no horário ${brs(a.data)} ${a.hora}`); save(); toast('Troca realizada.'); render();
  },
  ticket: d=>{
    if(!d.assunto||!d.desc.trim()) return toast('Preencha o assunto e a descrição.','error');
    const k={protocolo:'HD-'+new Date().getFullYear()+'-'+String(S.seq.tk++).padStart(5,'0'), assunto:d.assunto, desc:d.desc, data:today(), st:'aberto'};
    S.tickets.unshift(k); save(); toast(`Chamado ${k.protocolo} aberto.`); render();
  },
};

/* =========================================================
   Renderização e eventos
   ========================================================= */
function paintChrome(){
  const dark=document.documentElement.dataset.theme==='dark';
  $('#theme-btn').innerHTML=ic(dark?'sun':'moon');
  const c=counts(), prio=S.demandas.filter(d=>d.st==='pendente'&&d.prio).length;
  const items=[];
  if(c.recepcao) items.push(['recepcao','clock',`${c.recepcao} paciente(s) aguardando atendimento`]);
  if(prio) items.push(['demandas','inbox',`${prio} demanda(s) prioritária(s) na fila`]);
  if(c.judicial) items.push(['judicial','scale',`${c.judicial} ação(ões) judicial(is) com prazo em até 7 dias`]);
  if(c.solicitacoes) items.push(['solicitacoes','send',`${c.solicitacoes} solicitação(ões) externa(s) aguardando resposta`]);
  $('#bell').innerHTML=ic('bell')+(items.length?`<span class="dot">${items.length}</span>`:'');
  $('#bell-dd').innerHTML=`<div class="dd-h">Pendências</div>`+(items.length?items.map(([r,i,t])=>`<button class="dd-item" data-nav="${r}">${ic(i,16)}<span>${t}</span></button>`).join(''):'<div class="empty small">Nenhuma pendência.</div>');
}
function render(){
  const ae=document.activeElement, fid=ae&&ae.id&&$('#view').contains(ae)?ae.id:null, s1=ae&&ae.selectionStart, s2=ae&&ae.selectionEnd;
  $('#nav').innerHTML=navHTML();
  const info=ROUTE_INFO[UI.route];
  $('#crumb').textContent=info.group; $('#ptitle').textContent=info.label;
  document.title=info.label+' · Central de Regulação';
  if(location.hash.slice(1)!==UI.route) history.replaceState(null,'','#'+UI.route);
  $('#view').innerHTML=PAGES[UI.route]();
  paintChrome();
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus(); try{ el.setSelectionRange(s1,s2); }catch(e){} } }
}
function setPath(path, v){ const k=path.split('.'); let o=UI; for(let i=0;i<k.length-1;i++) o=o[k[i]]; o[k.at(-1)]=v; }

document.addEventListener('click', e=>{
  const t=e.target;
  if(!t.closest('.bell-wrap')) $('#bell-dd').classList.add('hide');
  if(!t.closest('.gsearch')) $('#gresults').classList.add('hide');
  $$('.picker .dropdown').forEach(d=>{ if(!d.parentElement.contains(t)) d.classList.add('hide'); });

  const pc=t.closest('[data-pick-id]'); if(pc){ setPicker(pc.closest('[data-picker]'), +pc.dataset.pickId); return; }
  const pn=t.closest('[data-pick-new]'); if(pn){ const pk=pn.closest('[data-picker]'); patientForm(null, p=>setPicker(pk,p.id)); return; }
  const pclr=t.closest('[data-pick-clear]'); if(pclr){ const pk=pclr.closest('[data-picker]'); $('input[type=hidden]',pk).value=''; $('.picker-sel',pk).classList.add('hide'); $('.picker-in',pk).classList.remove('hide'); const q=$('.picker-in input',pk); q.value=''; q.focus(); return; }

  const n=t.closest('[data-nav]');
  if(n){ e.preventDefault(); $$('.overlay').forEach(o=>o.remove()); $('#gsearch').value=''; nav(n.dataset.nav); return; }
  const gp=t.closest('[data-gpat]'); if(gp){ $('#gresults').classList.add('hide'); $('#gsearch').value=''; openPatient(+gp.dataset.gpat); return; }

  const b=t.closest('[data-act]'); if(!b || b.disabled) return;
  if(b.tagName==='A'||b.tagName==='BUTTON') e.preventDefault();
  const fn=ACT[b.dataset.act]; if(!fn) return;
  // ações disparadas de dentro de uma gaveta/modal fecham a sobreposição antes de agir
  const ov=b.closest('.overlay'); if(ov && !('keep' in b.dataset)) ov.remove();
  fn(b, e);
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.model && t.tagName!=='SELECT'){ if(t.type==='date' && !t.value) return; setPath(t.dataset.model, t.value); if(t.dataset.model!=='book.obs') render(); return; }
  if('pickerQ' in t.dataset){
    const dd=t.nextElementSibling, res=searchPatients(t.value,6);
    dd.innerHTML = (t.value.trim()? (res.length?res.map(p=>`<button type="button" class="dd-item" data-pick-id="${p.id}"><div class="avatar">${initials(p.nome)}</div><div class="who"><div><b>${esc(title(p.nome))}</b><span>Cód. ${p.id} · ${br(p.nasc)}</span></div></div></button>`).join(''):'<div class="empty small" style="padding:14px">Nenhum paciente encontrado.</div>') : '')
      + `<button type="button" class="dd-item" data-pick-new style="color:var(--primary);font-weight:600">${ic('plus',16)}Cadastrar novo paciente</button>`;
    dd.classList.remove('hide'); return;
  }
  if(t.id==='gsearch') globalSearch(t.value);
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.model && t.tagName==='SELECT'){ setPath(t.dataset.model, t.value); render(); }
});
document.addEventListener('submit', e=>{
  const f=e.target.closest('[data-form]'); if(!f) return;
  e.preventDefault(); FORMS[f.dataset.form](Object.fromEntries(new FormData(f)), f);
});
document.addEventListener('focusin', e=>{ if(e.target.dataset && 'pickerQ' in e.target.dataset) e.target.dispatchEvent(new Event('input',{bubbles:true})); });
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); $('#gsearch').focus(); $('#gsearch').select(); }
  if(e.key==='Escape'){ const o=$$('.overlay').at(-1); if(o) o.remove(); $('#gresults').classList.add('hide'); $('#bell-dd').classList.add('hide'); document.body.classList.remove('nav-open'); }
  if(e.key==='Enter' && e.target.id==='gsearch'){ e.preventDefault(); $('#gresults .dd-item')?.click(); }
});
document.addEventListener('mousedown', e=>{ if(document.body.classList.contains('nav-open') && !e.target.closest('.side') && !e.target.closest('.menu-btn')) document.body.classList.remove('nav-open'); });
window.addEventListener('hashchange', ()=>{ const r=location.hash.slice(1); if(PAGES[r] && r!==UI.route) nav(r); });

function globalSearch(v){
  const dd=$('#gresults'); if(!v.trim()){ dd.classList.add('hide'); return; }
  const pats=searchPatients(v,6), q=norm(v);
  const pages=Object.entries(ROUTE_INFO).filter(([k,i])=>norm(i.label).includes(q)).slice(0,4);
  dd.innerHTML=(pats.length?`<div class="dd-h">Pacientes</div>`+pats.map(p=>`<button class="dd-item" data-gpat="${p.id}"><div class="avatar">${initials(p.nome)}</div><div class="who"><div><b>${esc(title(p.nome))}</b><span>Cód. ${p.id} · CPF ${cpfFmt(p.cpf)}</span></div></div></button>`).join(''):'')
    +(pages.length?`<div class="dd-h">Telas</div>`+pages.map(([k,i])=>`<button class="dd-item" data-nav="${k}">${ic(i.icon,16)}${i.label}</button>`).join(''):'')
    +(!pats.length&&!pages.length?'<div class="empty small">Nada encontrado.</div>':'');
  dd.classList.remove('hide');
}

/* Inicialização */
try{ const th=localStorage.getItem('regamb_theme'); if(th) document.documentElement.dataset.theme=th; }catch(e){}
$('.menu-btn').innerHTML=ic('menu'); $('#gs-ico').innerHTML=ic('search',16); $('#unit-name').textContent=UNIDADE;
{ const r=location.hash.slice(1); if(PAGES[r]) UI.route=r; }
render();
// mantém tempos de espera e horários livres atualizados
setInterval(()=>{ if(!$('.overlay') && !$('#view').contains(document.activeElement)) render(); }, 60000);
</script>
</body>
</html>
